[package]
name = "claude-pet"
version = "0.1.0"
description = "Always-on-top desktop pet that shows Claude Code status"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

# 体积优化：release 下砍掉调试信息、开 LTO
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
