[package]
name = "claude-pet"
version = "0.1.0"
description = "Always-on-top desktop pet that shows Claude Code status"
edition = "2021"
# 1.77.2 是 tauri-plugin-autostart 2.5 要求的下限；写 1.77 会让 cargo add
# 误判并把依赖降成 2.0.0-rc.1 当下限。
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# preserve_order 是改用户 settings.json 的前提：默认的 Map 按字母序排键，
# 往返一次会把用户的配置整个重排。开了它 + 2 空格 pretty 打印后，
# 实测对真实 settings.json 是逐字节一致的往返。
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
tauri-plugin-autostart = "2"

# 体积优化：release 下砍掉调试信息、开 LTO
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
