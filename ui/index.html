<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Pet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- data-tauri-drag-region 只放在非交互区域：Tauri 只对「鼠标下那个元素本身」
         带该属性时才启动拖动，所以宠物图标和折叠按钮不会误触拖动。 -->
    <div id="card" class="card collapsed" data-tauri-drag-region>
      <div class="header" data-tauri-drag-region>
        <button id="toggle" class="chev" type="button" aria-label="展开或收起"></button>

        <!-- 折叠态：紧凑的宠物点阵 -->
        <div id="strip" class="strip"></div>

        <!-- 展开态：一句话概览 -->
        <div id="summary" class="summary" data-tauri-drag-region></div>
      </div>

      <!-- 展开态：每个项目一行工作空间，行内是该项目下的会话宠物 -->
      <div id="workspaces" class="workspaces"></div>

      <!-- 展开态：当前选中宠物的详情 -->
      <div id="detail" class="detail">
        <div class="avatar">
          <div class="ring"></div>
          <svg class="face" viewBox="0 0 40 40" aria-hidden="true">
            <circle class="head" cx="20" cy="20" r="15" />
            <g class="eyes eyes-open">
              <circle cx="14" cy="18" r="2.4" />
              <circle cx="26" cy="18" r="2.4" />
            </g>
            <g class="eyes eyes-wide">
              <circle cx="14" cy="18" r="3.8" />
              <circle cx="26" cy="18" r="3.8" />
            </g>
            <g class="eyes eyes-closed">
              <rect x="10.6" y="17.2" width="6.8" height="1.8" rx="0.9" />
              <rect x="22.6" y="17.2" width="6.8" height="1.8" rx="0.9" />
            </g>
            <g class="eyes eyes-happy">
              <path d="M10.8 19.4 L14 16.2 L17.2 19.4" />
              <path d="M22.8 19.4 L26 16.2 L29.2 19.4" />
            </g>
            <path class="mouth mouth-flat" d="M15.5 26 L24.5 26" />
            <path class="mouth mouth-smile" d="M15 25.2 Q20 28.8 25 25.2" />
            <path class="mouth mouth-open" d="M17 25.5 Q20 29.5 23 25.5 Q20 27 17 25.5" />
          </svg>
          <span class="bang">!</span>
        </div>
        <div class="info">
          <div class="line-1">
            <span id="dHead">挂件已启动</span><span id="dProj" class="dproj"></span>
          </div>
          <div id="dDetail" class="line-2">等 Claude Code 事件</div>
        </div>

        <!-- 只在这个会话有挂起的权限请求时出现 -->
        <div id="actions" class="actions" hidden>
          <button type="button" id="allow" class="act act-allow" title="允许这次工具调用">
            允许
          </button>
          <button type="button" id="deny" class="act act-deny" title="拒绝这次工具调用">
            拒绝
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
