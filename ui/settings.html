<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Pet</title>
    <!-- 刻意不引 style.css：那套是给透明无边框挂件写的，
         里面的 body flex 布局和 flex-shrink 测量逻辑会把普通窗口坑掉 -->
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body data-i18n-doctitle="set.title">
    <main id="app">
      <section class="group">
        <h2 data-i18n="set.general"></h2>

        <label class="row">
          <span class="label" data-i18n="set.autostart"></span>
          <input type="checkbox" id="autostart" />
        </label>
        <p class="hint" data-i18n-html="set.autostartHint"></p>

        <div class="row row-block">
          <span class="label" data-i18n="set.agents"></span>
          <span class="control control-list" id="agents"></span>
        </div>
        <p class="hint" data-i18n-html="set.agentsHint"></p>

        <label class="row">
          <span class="label" data-i18n="set.window"></span>
          <span class="control">
            <input type="number" id="window" min="1" max="1440" step="1" />
            <span class="unit" data-i18n="set.minutes"></span>
          </span>
        </label>
        <p class="hint" id="windowHint"></p>

        <label class="row">
          <span class="label" data-i18n="set.editor"></span>
          <span class="control">
            <select id="editor"></select>
          </span>
        </label>
        <p class="hint" id="editorHint"></p>

        <label class="row">
          <span class="label" data-i18n="set.position"></span>
          <span class="control">
            <select id="position"></select>
          </span>
        </label>
        <p class="hint" data-i18n-html="set.positionHint"></p>

        <label class="row">
          <span class="label" data-i18n="set.lang"></span>
          <span class="control">
            <select id="lang">
              <option value="auto" data-i18n="set.langAuto"></option>
              <option value="zh">简体中文</option>
              <option value="en">English</option>
            </select>
          </span>
        </label>
        <p class="hint" data-i18n="set.langHint"></p>
      </section>

      <section class="group">
        <h2 data-i18n="set.sound"></h2>

        <label class="row">
          <span class="label" data-i18n="set.soundOn"></span>
          <input type="checkbox" id="soundOn" />
        </label>
        <p class="hint" data-i18n="set.soundOnHint"></p>

        <label class="row">
          <span class="label" data-i18n="set.soundPick"></span>
          <span class="control">
            <select id="sound"></select>
            <button type="button" id="preview" class="btn-slim" data-i18n="set.preview"></button>
          </span>
        </label>
        <p class="hint" data-i18n="set.soundHint"></p>
      </section>

      <section class="group">
        <h2 data-i18n="set.shortcuts"></h2>

        <label class="row">
          <span class="label" data-i18n="set.scToggle"></span>
          <span class="control">
            <input type="text" id="scToggle" class="accel" spellcheck="false" />
          </span>
        </label>

        <label class="row">
          <span class="label" data-i18n="set.scNext"></span>
          <span class="control">
            <input type="text" id="scNext" class="accel" spellcheck="false" />
          </span>
        </label>

        <p class="hint" data-i18n-html="set.scHint"></p>
      </section>

      <section class="group">
        <h2 data-i18n="set.hooks"></h2>

        <div class="row">
          <span class="label" data-i18n="set.hooksStatus"></span>
          <span class="control">
            <span id="hooksStatus" class="badge" data-i18n="set.reading"></span>
          </span>
        </div>
        <div class="row">
          <span class="label"></span>
          <span class="control">
            <button type="button" id="installHooks" data-i18n="set.install"></button>
            <button type="button" id="uninstallHooks" class="btn-danger" data-i18n="set.uninstall"></button>
          </span>
        </div>
        <p class="hint" id="hooksHint"></p>

        <label class="row">
          <span class="label" data-i18n="set.permOn"></span>
          <input type="checkbox" id="permOn" />
        </label>
        <label class="row">
          <span class="label" data-i18n="set.permMatcher"></span>
          <span class="control">
            <input type="text" id="permMatcher" class="accel" spellcheck="false" placeholder="Bash" />
          </span>
        </label>
        <p class="hint" id="permHint"></p>
      </section>

      <section class="group">
        <h2 data-i18n="set.about"></h2>
        <dl class="about">
          <dt data-i18n="set.version"></dt><dd id="version"></dd>
          <dt data-i18n="set.port"></dt><dd id="port"></dd>
          <dt data-i18n="set.configDir"></dt><dd id="configDir" class="selectable"></dd>
          <dt data-i18n="set.repo"></dt><dd id="repo" class="selectable"></dd>
        </dl>

        <label class="row">
          <span class="label" data-i18n="set.checkUpdates"></span>
          <input type="checkbox" id="checkUpdates" />
        </label>
        <div class="row">
          <span class="label"></span>
          <span class="control">
            <button type="button" id="checkNow" data-i18n="set.checkNow"></button>
          </span>
        </div>
        <p class="hint" id="updateResult"></p>
        <p class="hint" data-i18n="set.checkUpdatesHint"></p>
        <pre id="updateCmd" class="cmd selectable" hidden></pre>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="i18n.js"></script>
    <script src="update.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
