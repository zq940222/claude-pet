<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Pet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- data-tauri-drag-region：整张卡片都能拖动窗口，不用写一行 Rust -->
    <div id="pet" class="pet state-idle" data-tauri-drag-region>
      <div class="avatar">
        <div class="ring"></div>
        <svg class="face" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="head" cx="20" cy="20" r="15" />
          <g class="eyes eyes-open">
            <circle cx="14" cy="18" r="2.4" />
            <circle cx="26" cy="18" r="2.4" />
          </g>
          <g class="eyes eyes-wide">
            <circle cx="14" cy="18" r="3.8" />
            <circle cx="26" cy="18" r="3.8" />
          </g>
          <g class="eyes eyes-closed">
            <rect x="10.6" y="17.2" width="6.8" height="1.8" rx="0.9" />
            <rect x="22.6" y="17.2" width="6.8" height="1.8" rx="0.9" />
          </g>
          <g class="eyes eyes-happy">
            <path d="M10.8 19.4 L14 16.2 L17.2 19.4" />
            <path d="M22.8 19.4 L26 16.2 L29.2 19.4" />
          </g>
          <path class="mouth mouth-flat" d="M15.5 26 L24.5 26" />
          <path class="mouth mouth-smile" d="M15 25.2 Q20 28.8 25 25.2" />
          <path class="mouth mouth-open" d="M17 25.5 Q20 29.5 23 25.5 Q20 27 17 25.5" />
        </svg>
        <span class="bang">!</span>
      </div>

      <div class="info">
        <div class="line-1">
          <span id="headline">挂件已启动</span
          ><span class="project" id="project"></span>
        </div>
        <div class="line-2" id="detail">等 Claude Code 事件</div>
      </div>

      <div class="badge" id="badge" hidden></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
